name: Build, test and release

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      bump_level:
        description: "Version increment level"
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor

permissions:
  contents: read
  checks: write
  packages: write

concurrency:
  # Scope contention to one ref, so unrelated branches and pull requests can run together.
  # For the same ref, finish the active run; GitHub retains only the newest pending run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_requested: ${{ steps.plan.outputs.release_requested }}
      package_version: ${{ steps.plan.outputs.package_version }}
      assembly_version: ${{ steps.plan.outputs.assembly_version }}
      file_version: ${{ steps.plan.outputs.file_version }}
      informational_version: ${{ steps.plan.outputs.informational_version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    env:
      PACKAGE_JSON: Conduit.Unity/package.json

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Version decision

          `version` validates the SemVer in `Conduit.Unity/package.json`, then makes one release
          decision for the rest of the workflow:

          | Trigger             | Condition                                             | Plan                                          |
          | ------------------- | ----------------------------------------------------- | --------------------------------------------- |
          | `push`              | `master`, without `[skip release]` in the head commit | bump patch                                    |
          | `workflow_dispatch` | `master`                                              | apply the selected patch, minor or major bump |
          | any other run       |                                                       | validate only; retain the package version     |

          The job also selects the most recently created `vMAJOR.MINOR.PATCH` tag for release-note
          comparisons. Its outputs are the release decision, the package/assembly/file/informational
          versions and that previous tag. No repository or GitHub Release state changes here.
          EOF

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Plan version metadata
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(
            git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1 ||
            true
          )"

          current="$(jq -r '.version' "$PACKAGE_JSON")"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$current' is not SemVer (x.y.z)"
            exit 1
          fi

          release_requested=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
              release_requested=true
              level="${{ inputs.bump_level }}"
            else
              level=""
            fi
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" && "${{ contains(github.event.head_commit.message, '[skip release]') }}" != "true" ]]; then
            release_requested=true
            level="patch"
          else
            level=""
          fi

          package_version="$current"
          if [[ "$release_requested" == "true" ]]; then
            IFS='.' read -r major minor patch <<<"$current"

            case "$level" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "Unsupported bump level: '$level'"
                exit 1
                ;;
            esac

            package_version="$major.$minor.$patch"
          fi

          IFS='.' read -r major minor patch <<<"$package_version"
          assembly_version="$major.$minor.$patch.0"
          file_build=$(( GITHUB_RUN_NUMBER % 65535 ))
          if [[ "$file_build" -eq 0 ]]; then
            file_build=65534
          fi
          file_version="$major.$minor.$patch.$file_build"
          short_sha="${GITHUB_SHA::12}"
          informational_version="$package_version+sha.$short_sha"

          {
            echo "release_requested=$release_requested"
            echo "package_version=$package_version"
            echo "assembly_version=$assembly_version"
            echo "file_version=$file_version"
            echo "informational_version=$informational_version"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            publish_name: conduit-linux-x64
            publish_source: Conduit.Server/publish/linux-x64/conduit
            publish_target: conduit-linux-x64
          - os: ubuntu-latest
            rid: linux-musl-x64
            publish_name: conduit-linux-musl-x64
            publish_source: Conduit.Server/publish/linux-musl-x64/conduit
            publish_target: conduit-linux-musl-x64
          - os: windows-latest
            rid: win-x64
            publish_name: conduit-win-x64
            publish_source: Conduit.Server/publish/win-x64/conduit.exe
            publish_target: conduit-win-x64.exe

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Release binary: `${{ matrix.rid }}`

          | Artifact contract | Value                                           |
          | ----------------- | ----------------------------------------------- |
          | Workflow artifact | `${{ matrix.publish_name }}`                    |
          | File              | `${{ matrix.publish_target }}`                  |
          | Publish mode      | `Release`, self-contained, single file          |
          | Version metadata  | values fixed by `version` for this workflow run |

          The native Linux build is invoked on the runner. The musl build is invoked in Alpine
          3.22 with its runtime libraries installed. Windows execution is deferred to the Windows
          smoke job, where the downloaded artifact runs on its target OS.

          This job establishes that the target can be published and packages the result for every
          downstream consumer. Protocol behavior and Unity interoperability are tested later,
          against this exact artifact rather than a rebuild.
          EOF

      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.201

      - name: Build server binary
        shell: bash
        run: |
          dotnet publish Conduit.Server/Conduit.csproj -c Release -r "${{ matrix.rid }}" \
            -p:Version="${{ needs.version.outputs.package_version }}" \
            -p:AssemblyVersion="${{ needs.version.outputs.assembly_version }}" \
            -p:FileVersion="${{ needs.version.outputs.file_version }}" \
            -p:InformationalVersion="${{ needs.version.outputs.informational_version }}" \
            -p:IncludeSourceRevisionInInformationalVersion=false \
            -p:Company="${{ github.repository_owner }}" \
            -p:Product="${{ github.event.repository.name }}"
          mkdir -p "$RUNNER_TEMP/release"
          cp "${{ matrix.publish_source }}" "$RUNNER_TEMP/release/${{ matrix.publish_target }}"

          if [[ "${{ matrix.rid }}" == "linux-x64" ]]; then
            chmod +x "$RUNNER_TEMP/release/${{ matrix.publish_target }}"
            "$RUNNER_TEMP/release/${{ matrix.publish_target }}" --version
          fi

          if [[ "${{ matrix.rid }}" == "linux-musl-x64" ]]; then
            docker run --rm \
              -v "$RUNNER_TEMP/release:/release:ro" \
              alpine:3.22 \
              sh -c 'apk add --no-cache libgcc libstdc++ zlib >/dev/null && /release/${{ matrix.publish_target }} --version'
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.publish_name }}
          path: ${{ runner.temp }}/release/${{ matrix.publish_target }}

  test-server-binary:
    needs: build
    name: server binary smoke (${{ matrix.platform }}, ${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            artifact: conduit-linux-x64
            executable: conduit-linux-x64
            transport: stdio
          - os: ubuntu-latest
            platform: linux-x64
            artifact: conduit-linux-x64
            executable: conduit-linux-x64
            transport: http
          - os: windows-latest
            platform: win-x64
            artifact: conduit-win-x64
            executable: conduit-win-x64.exe
            transport: stdio
          - os: windows-latest
            platform: win-x64
            artifact: conduit-win-x64
            executable: conduit-win-x64.exe
            transport: http

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### `${{ matrix.platform }}` / `${{ matrix.transport }}` binary smoke

          The test runs the downloaded release executable on its target hosted OS. The protocol
          trace is deliberately short:

          ```text
          --version
              ↓
          launch against an isolated Unity-project fixture and fake bridge
              ↓
          initialize → initialized → tools/list → status
          ```

          Every message uses `${{ matrix.transport }}` (stdio or loopback HTTP). A startup error,
          broken exchange, invalid sequence or unexpected response fails the matrix case.

          The fake bridge keeps this check focused on the packaged server and transport boundary.
          Real Unity Editor integration, broader tool coverage, musl, and sustained-load behavior
          have dedicated jobs or remain outside this smoke test.
          EOF

      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.201

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/conduit-server

      - name: Run binary smoke test
        shell: bash
        run: |
          executable="$RUNNER_TEMP/conduit-server/${{ matrix.executable }}"
          if [[ "${{ runner.os }}" == "Linux" ]]; then chmod +x "$executable"; fi
          "$executable" --version
          dotnet run --file run-conduit-binary-smoke.cs -- \
            --transport "${{ matrix.transport }}" \
            "$executable"

  test-server-binary-musl:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Alpine is the test boundary

          ```text
          Ubuntu runner
          ├─ publish smoke harness for linux-musl-x64
          └─ Alpine 3.22 container
             ├─ musl smoke harness
             └─ conduit-linux-musl-x64
                └─ stdio: initialize → tools/list → status
          ```

          Both the harness and downloaded server execute inside Alpine. This avoids treating a
          successful build on the runner's glibc host as evidence that the musl executable can
          start. The build matrix has already invoked `--version` in Alpine; this job advances the
          check through the MCP exchange.

          A pass covers x64 startup and the minimal stdio MCP exchange on Alpine 3.22. HTTP,
          other distributions and architectures, and the remaining tools are outside this case.
          EOF

      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.201

      - uses: actions/download-artifact@v8
        with:
          name: conduit-linux-musl-x64
          path: ${{ runner.temp }}/conduit-server

      - name: Run musl binary smoke test
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/musl-smoke"
          mkdir -p "$work"
          cp "$RUNNER_TEMP/conduit-server/conduit-linux-musl-x64" "$work/"
          chmod +x "$work/conduit-linux-musl-x64"

          dotnet publish run-conduit-binary-smoke.cs \
            -c Release \
            -r linux-musl-x64 \
            --self-contained \
            -p:PublishAot=false \
            -p:PublishSingleFile=true \
            -p:InvariantGlobalization=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o "$work/runner"

          docker run --rm \
            -v "$work:/work" \
            -w /work \
            alpine:3.22 \
            sh -c \
              'apk add --no-cache libgcc libstdc++ zlib >/dev/null && \
               /work/runner/run-conduit-binary-smoke \
                 --transport stdio \
                 /work/conduit-linux-musl-x64'

  test-server:
    needs: version
    name: server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Server tests on `${{ matrix.os }}`

          The repository's TUnit suite writes `test-results/dotnet.trx`; the test reporter turns
          that file into GitHub check annotations.

          | Test command | Report step                     | Final job state                  |
          | ------------ | ------------------------------- | -------------------------------- |
          | passes       | publishes the TRX results       | pass                             |
          | fails        | still publishes any TRX results | fail in the explicit final guard |

          `continue-on-error` applies only to the test-command step. It preserves the report path
          while the later guard reads the command's original outcome, so a red suite cannot become
          a green job.

          Ubuntu and Windows each run the source-level server suite. The packaged executables,
          Unity bridge and standalone players are validated elsewhere in the workflow.
          EOF

      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.201

      - name: Run TUnit tests
        id: dotnet-tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-results
          dotnet run --project Conduit.Tests/Conduit.Tests.csproj \
            -- \
            --results-directory test-results \
            --report-trx \
            --report-trx-filename dotnet.trx

      - uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Dotnet Test Results (${{ matrix.os }})
          reporter: dotnet-trx
          path: test-results/dotnet.trx
          fail-on-error: false

      - name: Fail on dotnet test errors
        if: steps.dotnet-tests.outcome == 'failure'
        run: exit 1

  test-unity:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: /ConduitCI
      REPO_ROOT: /UnityConduitRepo
    strategy:
      fail-fast: false
      matrix:
        UNITY_VERSION: [
          # 6.6
          6000.6.0b6,
          # 6.5
          6000.5.6f1,
          # 6.4
          6000.4.12f1,
          # 6.3 LTS
          6000.3.21f1,
          # 6.2
          6000.2.15f1,
          # 6.1
          6000.1.17f1,
          # 6.0 LTS
          6000.0.80f1,
        ]

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Unity `${{ matrix.UNITY_VERSION }}` coverage point

          | Axis           | Configuration under test                         |
          | -------------- | ------------------------------------------------ |
          | Host           | Linux container                                  |
          | Package        | current checkout, mounted as an embedded package |
          | Runtime bridge | enabled through the debug-build opt-in           |
          | Server         | this run's `conduit-linux-x64` artifact          |
          | Suites         | EditMode, then PlayMode in the Editor            |

          Unity must finish both suites and leave their NUnit XML reports behind. Reports are
          published as check annotations even when the Unity command fails; the original command
          outcome or missing reports then fail the job.

          This is one entry in a seven-version Unity 6 matrix. Standalone player behavior is tested
          by the player jobs; native Windows Editor behavior runs in a separate job.

          > The version-scoped GHCR BuildKit cache shortens image construction. It is disposable
          > and supplies no test evidence.
          EOF

      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: conduit-linux-x64
          path: ${{ runner.temp }}/conduit-server

      - name: Prepare server artifact
        run: chmod +x "$RUNNER_TEMP/conduit-server/conduit-linux-x64"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prep vars
        run: |
          REPO='${{ github.repository }}'
          REPO_LC=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          {
            echo "REPO_LC=$REPO_LC"
            echo "IMAGE_TAG=ghcr.io/$REPO_LC/unity-ci:${{ github.sha }}-${{ matrix.UNITY_VERSION }}"
            echo "CACHE_REF=ghcr.io/$REPO_LC/unity-ci:cache-${{ matrix.UNITY_VERSION }}"
          } >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: ./.github/workflows/Dockerfile
          load: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            UNITY_VERSION=${{ matrix.UNITY_VERSION }}
            PROJECT=${{ env.PROJECT }}
          secrets: |
            unity_serial=${{ secrets.UNITY_SERIAL }}
            unity_user=${{ secrets.UNITY_USER }}
            unity_password=${{ secrets.UNITY_PASSWORD }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=min

      - name: Prepare secrets and license dir
        run: |
          [ -n "${{ secrets.UNITY_SERIAL }}" ] || { echo "UNITY_SERIAL is not configured."; exit 1; }
          [ -n "${{ secrets.UNITY_USER }}" ] || { echo "UNITY_USER is not configured."; exit 1; }
          [ -n "${{ secrets.UNITY_PASSWORD }}" ] || { echo "UNITY_PASSWORD is not configured."; exit 1; }

          echo "::add-mask::${{ secrets.UNITY_SERIAL }}"
          echo "::add-mask::${{ secrets.UNITY_USER }}"
          masked="${{ secrets.UNITY_SERIAL }}"
          masked="${masked%????}XXXX"
          echo "::add-mask::$masked"
          echo "LIC_DIR=$RUNNER_TEMP/unity-lic" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/unity-lic"
          mkdir -p "$RUNNER_TEMP/unity-secrets"
          mkdir -p "$RUNNER_TEMP/test-results"
          install -m 600 /dev/null "$RUNNER_TEMP/unity-secrets/unity_serial"
          install -m 600 /dev/null "$RUNNER_TEMP/unity-secrets/unity_user"
          install -m 600 /dev/null "$RUNNER_TEMP/unity-secrets/unity_password"
          printf '%s' '${{ secrets.UNITY_SERIAL }}' > "$RUNNER_TEMP/unity-secrets/unity_serial"
          printf '%s' '${{ secrets.UNITY_USER }}' > "$RUNNER_TEMP/unity-secrets/unity_user"
          printf '%s' '${{ secrets.UNITY_PASSWORD }}' > "$RUNNER_TEMP/unity-secrets/unity_password"

      - name: Run tests
        id: unity-tests
        continue-on-error: true
        run: |
          set -euo pipefail
          size_bytes=$(docker image inspect "${{ env.IMAGE_TAG }}" --format='{{.Size}}')
          size_mib=$(awk -v b="$size_bytes" 'BEGIN{printf "%.2f", b/1024/1024}')
          echo "Docker image size: ${size_mib} MiB"

          docker run --rm \
            --shm-size=8g \
            -e CONDUIT_SERVER_EXECUTABLE=/ConduitServer/conduit-linux-x64 \
            -v "$GITHUB_WORKSPACE/Conduit.Unity:$PROJECT/Packages/dev.tryfinally.conduit" \
            -v "$GITHUB_WORKSPACE:${{ env.REPO_ROOT }}" \
            -v "$RUNNER_TEMP/conduit-server:/ConduitServer:ro" \
            -v "$RUNNER_TEMP/test-results:$PROJECT/test-results" \
            -v "$LIC_DIR:/root/.local/share/unity3d" \
            -v "$RUNNER_TEMP/unity-secrets:/run/secrets:ro" \
            -w "$PROJECT" \
            "${{ env.IMAGE_TAG }}" \
            unity-editor \
              -login \
              -projectPath "$PROJECT" \
              -executeMethod Conduit.CI.RunTests

      - name: Locate Unity test results
        id: unity-test-results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/test-results/*tests.xml)
          if (( ${#reports[@]} > 0 )); then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity exited before producing a test report."
          fi

      - uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && steps.unity-test-results.outputs.found == 'true' }}
        with:
          name: Unity Test Results (${{ matrix.UNITY_VERSION }})
          reporter: dotnet-nunit
          path: "${{ runner.temp }}/test-results/*tests.xml"
          fail-on-error: false

      - name: Fail on Unity test errors
        if: steps.unity-tests.outcome == 'failure' || steps.unity-test-results.outputs.found != 'true'
        run: exit 1

  test-unity-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT: /ConduitConsumerCI
      UNITY_VERSION: 6000.0.80f1

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Production exclusion invariant

          ```text
          embedded Conduit package
          + empty consumer manifest
          + CONDUIT_INCLUDE_IN_DEBUG_BUILDS disabled
          + non-development Linux Mono build
          = player build succeeds without Conduit.Unity.Runtime.dll
          ```

          Unity 6000.0.80f1 builds the fixture scene in Docker. Afterward, the job searches both
          the project's compiled assemblies and the player output; finding the runtime MCP bridge
          in either location is a failure.

          The temporary player is build evidence only. It is neither launched nor uploaded. This
          gate models a normal production consumer whose installed Editor tooling must stay out of
          the shipped player.
          EOF

      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image variables
        shell: bash
        run: |
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_TAG=ghcr.io/$repo_lc/unity-consumer-ci:${{ github.sha }}-$UNITY_VERSION" >> "$GITHUB_ENV"
          echo "CACHE_REF=ghcr.io/$repo_lc/unity-consumer-ci:cache-$UNITY_VERSION" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: ./.github/workflows/Dockerfile
          load: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            UNITY_VERSION=${{ env.UNITY_VERSION }}
            PROJECT=${{ env.PROJECT }}
            PROJECT_MANIFEST=consumer
            CONDUIT_RUNTIME_DEFINE=0
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=min

      - name: Build minimal production consumer
        shell: bash
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_USER: ${{ secrets.UNITY_USER }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in UNITY_SERIAL UNITY_USER UNITY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "$name is not configured."; exit 1; }
          done

          mkdir -p \
            "$RUNNER_TEMP/unity-license" \
            "$RUNNER_TEMP/unity-secrets" \
            "$RUNNER_TEMP/consumer-player"
          printf '%s' "$UNITY_SERIAL" > "$RUNNER_TEMP/unity-secrets/unity_serial"
          printf '%s' "$UNITY_USER" > "$RUNNER_TEMP/unity-secrets/unity_user"
          printf '%s' "$UNITY_PASSWORD" > "$RUNNER_TEMP/unity-secrets/unity_password"
          chmod 600 "$RUNNER_TEMP"/unity-secrets/*

          docker run --rm \
            --shm-size=8g \
            -v "$GITHUB_WORKSPACE/Conduit.Unity:$PROJECT/Packages/dev.tryfinally.conduit" \
            -v "$RUNNER_TEMP/consumer-player:$PROJECT/player-output" \
            -v "$RUNNER_TEMP/unity-license:/root/.local/share/unity3d" \
            -v "$RUNNER_TEMP/unity-secrets:/run/secrets:ro" \
            -w "$PROJECT" \
            "$IMAGE_TAG" \
            unity-editor \
              -login \
              -projectPath "$PROJECT" \
              -executeMethod Conduit.CI.BuildConsumerPlayer \
              -conduitPlayerTarget linux \
              -conduitPlayerOutput "$PROJECT/player-output/conduit-player"

  test-unity-editor-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      UNITY_VERSION: 6000.4.12f1

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Required native-Windows evidence

          Unity 6000.4.12f1 is installed on the hosted Windows runner. The job creates a minimal
          project, embeds the current package, injects this run's `conduit-win-x64` binary and runs
          the Windows-compatible EditMode selection.

          A green job requires all of the following evidence:

          - Unity must exit successfully and write an NUnit report. This catches launch,
            compilation, and test failures.
          - Exactly one passing `ConduitMcpEndToEndTests.Initialize_Succeeds` case confirms that
            the filter reached native MCP initialization.
          - The report must also contain exactly one passing
            `ConduitSetupWizardTests.ExistingConfigWithWindowsWslPathCountsAsDownloadedAndConfigured`
            case. This is the required Windows/WSL command-path coverage.

          The explicit test-case checks prevent an accidentally empty filtered run from passing.
          PlayMode and Windows-player coverage belong to later jobs. The stripped Editor is restored
          directly from cache; a cache miss downloads and extracts it without running the installer.
          EOF

      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: conduit-win-x64
          path: ${{ runner.temp }}/conduit-server

      - name: Configure paths
        shell: pwsh
        run: |
          "UNITY_ROOT=$env:RUNNER_TEMP\Unity" >> $env:GITHUB_ENV
          "PROJECT=$env:RUNNER_TEMP\ConduitEditorCI" >> $env:GITHUB_ENV
          "TEST_RESULTS=$env:GITHUB_WORKSPACE\test-results\unity-editmode-windows.xml" >> $env:GITHUB_ENV
          "CONDUIT_REPO_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          "CONDUIT_SERVER_EXECUTABLE=$env:RUNNER_TEMP\conduit-server\conduit-win-x64.exe" >> $env:GITHUB_ENV

      - uses: ./.github/actions/setup-unity-windows
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          unity-root: ${{ env.UNITY_ROOT }}

      - name: Prepare Unity project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "$env:PROJECT\Packages" | Out-Null
          New-Item -ItemType Directory -Force "$env:PROJECT\ProjectSettings" | Out-Null
          New-Item -ItemType Directory -Force "$env:PROJECT\Assets" | Out-Null
          New-Item -ItemType Directory -Force (Split-Path $env:TEST_RESULTS) | Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\Conduit.Unity" "$env:PROJECT\Packages\dev.tryfinally.conduit"
          Copy-Item "$env:GITHUB_WORKSPACE\.github\workflows\test-manifest.json" "$env:PROJECT\Packages\manifest.json"
          @"
          m_EditorVersion: $env:UNITY_VERSION
          "@ | Set-Content "$env:PROJECT\ProjectSettings\ProjectVersion.txt"

      - name: Run Windows EditMode tests
        id: windows-unity-tests
        continue-on-error: true
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_USER: ${{ secrets.UNITY_USER }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("UNITY_SERIAL", "UNITY_USER", "UNITY_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "$name is not configured."
            }
          }

          $unity = @(
            "$env:UNITY_ROOT\Editor\Unity.exe",
            "$env:UNITY_ROOT\Unity.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $unity) {
            throw "Unity.exe was not found under $env:UNITY_ROOT."
          }

          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\Unity\Caches" | Out-Null
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\Unity\licenses" | Out-Null
          New-Item -ItemType Directory -Force "$env:APPDATA\Unity" | Out-Null
          New-Item -ItemType Directory -Force "$env:PROGRAMDATA\Unity" | Out-Null
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new($unity)
          $startInfo.UseShellExecute = $false
          $startInfo.WorkingDirectory = $env:PROJECT
          foreach ($argument in @(
            "-batchmode",
            "-nographics",
            "-silent-crashes",
            "-logFile", "-",
            "-serial", $env:UNITY_SERIAL,
            "-username", $env:UNITY_USER,
            "-password", $env:UNITY_PASSWORD,
            "-projectPath", $env:PROJECT,
            "-executeMethod", "Conduit.CI.RunFilteredEditModeTestsFromCommandLine",
            "-conduitTestResults", $env:TEST_RESULTS
          )) {
            $startInfo.ArgumentList.Add($argument)
          }
          $process = [System.Diagnostics.Process]::Start($startInfo)
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            throw "Unity EditMode tests exited with code $($process.ExitCode)."
          }

      - name: Locate Windows Unity test results
        id: windows-unity-test-results
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (Test-Path $env:TEST_RESULTS) {
            "found=true" >> $env:GITHUB_OUTPUT
          } else {
            "found=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::Unity exited before producing a test report."
          }

      - uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && steps.windows-unity-test-results.outputs.found == 'true' }}
        with:
          name: Unity EditMode Test Results (Windows)
          reporter: dotnet-nunit
          path: test-results/unity-editmode-windows.xml
          fail-on-error: false

      - name: Validate required Windows coverage
        if: ${{ !cancelled() && steps.windows-unity-test-results.outputs.found == 'true' }}
        shell: pwsh
        run: |
          [xml]$report = Get-Content -Raw $env:TEST_RESULTS
          $testCases = @($report.SelectNodes("//test-case"))
          $required = @(
            "ConduitMcpEndToEndTests.Initialize_Succeeds",
            "ConduitSetupWizardTests.ExistingConfigWithWindowsWslPathCountsAsDownloadedAndConfigured"
          )
          foreach ($fullName in $required) {
            $matchingTests = @($testCases | Where-Object {
              $testName = [string]$_.fullname
              $testName -eq $fullName -or $testName.EndsWith(".$fullName")
            })
            if ($matchingTests.Count -ne 1 -or $matchingTests[0].result -ne "Passed") {
              throw "Required Windows test '$fullName' did not pass."
            }
          }

      - name: Fail on Windows Unity test errors
        if: steps.windows-unity-tests.outcome == 'failure' || steps.windows-unity-test-results.outputs.found != 'true'
        run: exit 1

  build-player-linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT: /ConduitPlayerCI
      UNITY_VERSION: 6000.4.12f1

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Linux player handoff

          ```text
          current package + player manifest
                    ↓
          Unity 6000.4.12f1 in Docker
          development · StandaloneLinux64 · Mono · runtime bridge enabled
                    ↓
          complete test-player-linux workflow artifact
                    ↓
          test-player-linux (launch and MCP E2E)
          ```

          This producer job stops after Unity builds the fixture scene and the complete player
          directory is uploaded. All runtime assertions happen in the downstream job against that
          downloaded directory.

          The GHCR BuildKit cache affects Docker image preparation time only; the package checkout
          and generated player artifact still come from this workflow run.
          EOF

      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image variables
        shell: bash
        run: |
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_TAG=ghcr.io/$repo_lc/unity-player-ci:${{ github.sha }}-$UNITY_VERSION" >> "$GITHUB_ENV"
          echo "CACHE_REF=ghcr.io/$repo_lc/unity-player-ci:cache-$UNITY_VERSION" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: ./.github/workflows/Dockerfile
          load: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            UNITY_VERSION=${{ env.UNITY_VERSION }}
            PROJECT=${{ env.PROJECT }}
            PROJECT_MANIFEST=player
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=min

      - name: Build Linux development player
        shell: bash
        run: |
          set -euo pipefail
          for name in UNITY_SERIAL UNITY_USER UNITY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "$name is not configured."; exit 1; }
          done

          mkdir -p "$RUNNER_TEMP/unity-license" "$RUNNER_TEMP/unity-secrets" "$RUNNER_TEMP/player-linux"
          printf '%s' "$UNITY_SERIAL" > "$RUNNER_TEMP/unity-secrets/unity_serial"
          printf '%s' "$UNITY_USER" > "$RUNNER_TEMP/unity-secrets/unity_user"
          printf '%s' "$UNITY_PASSWORD" > "$RUNNER_TEMP/unity-secrets/unity_password"
          chmod 600 "$RUNNER_TEMP"/unity-secrets/*

          docker run --rm \
            --shm-size=8g \
            -v "$GITHUB_WORKSPACE/Conduit.Unity:$PROJECT/Packages/dev.tryfinally.conduit" \
            -v "$RUNNER_TEMP/player-linux:$PROJECT/player-output" \
            -v "$RUNNER_TEMP/unity-license:/root/.local/share/unity3d" \
            -v "$RUNNER_TEMP/unity-secrets:/run/secrets:ro" \
            -w "$PROJECT" \
            "$IMAGE_TAG" \
            unity-editor \
              -login \
              -projectPath "$PROJECT" \
              -executeMethod Conduit.CI.BuildPlayer \
              -conduitPlayerTarget linux \
              -conduitPlayerOutput "$PROJECT/player-output/conduit-player"
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_USER: ${{ secrets.UNITY_USER }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - uses: actions/upload-artifact@v6
        with:
          name: test-player-linux
          path: ${{ runner.temp }}/player-linux

  build-player-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      UNITY_VERSION: 6000.4.12f1

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### One Windows build, two runtime environments

          Unity 6000.4.12f1 builds the fixture scene on a Windows runner using these settings:
          development player, `StandaloneWindows64`, Mono, embedded package, and
          `CONDUIT_INCLUDE_IN_DEBUG_BUILDS` enabled.

          ```text
          test-player-windows artifact
          ├─ native Windows player E2E
          └─ Ubuntu + UMU-Proton player E2E
          ```

          Uploading the complete player directory is this job's finish line. The two consumers
          launch the same bits independently, which separates a Unity build failure from a native
          Windows or Proton runtime failure. The stripped Editor cache changes setup time only.
          EOF

      - uses: actions/checkout@v6

      - name: Configure paths
        shell: pwsh
        run: |
          "UNITY_ROOT=$env:RUNNER_TEMP\Unity" >> $env:GITHUB_ENV
          "PROJECT=$env:RUNNER_TEMP\ConduitPlayerCI" >> $env:GITHUB_ENV

      - uses: ./.github/actions/setup-unity-windows
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          unity-root: ${{ env.UNITY_ROOT }}

      - name: Prepare Unity project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "$env:PROJECT\Packages" | Out-Null
          New-Item -ItemType Directory -Force "$env:PROJECT\ProjectSettings" | Out-Null
          New-Item -ItemType Directory -Force "$env:PROJECT\Assets" | Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\Conduit.Unity" "$env:PROJECT\Packages\dev.tryfinally.conduit"
          Copy-Item "$env:GITHUB_WORKSPACE\.github\workflows\player-manifest.json" "$env:PROJECT\Packages\manifest.json"
          @"
          m_EditorVersion: $env:UNITY_VERSION
          "@ | Set-Content "$env:PROJECT\ProjectSettings\ProjectVersion.txt"

      - name: Build Windows development player
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_USER: ${{ secrets.UNITY_USER }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("UNITY_SERIAL", "UNITY_USER", "UNITY_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "$name is not configured."
            }
          }

          $unity = @(
            "$env:UNITY_ROOT\Editor\Unity.exe",
            "$env:UNITY_ROOT\Unity.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $unity) {
            throw "Unity.exe was not found under $env:UNITY_ROOT."
          }

          $output = "$env:RUNNER_TEMP\player-windows\conduit-player.exe"
          New-Item -ItemType Directory -Force (Split-Path $output) | Out-Null
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\Unity\Caches" | Out-Null
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\Unity\licenses" | Out-Null
          New-Item -ItemType Directory -Force "$env:APPDATA\Unity" | Out-Null
          New-Item -ItemType Directory -Force "$env:PROGRAMDATA\Unity" | Out-Null
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new($unity)
          $startInfo.UseShellExecute = $false
          $startInfo.WorkingDirectory = $env:PROJECT
          foreach ($argument in @(
            "-batchmode",
            "-nographics",
            "-silent-crashes",
            "-logFile", "-",
            "-serial", $env:UNITY_SERIAL,
            "-username", $env:UNITY_USER,
            "-password", $env:UNITY_PASSWORD,
            "-projectPath", $env:PROJECT,
            "-executeMethod", "Conduit.CI.BuildPlayer",
            "-conduitPlayerTarget", "windows",
            "-conduitPlayerOutput", $output
          )) {
            $startInfo.ArgumentList.Add($argument)
          }
          $process = [System.Diagnostics.Process]::Start($startInfo)
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            throw "Unity player build exited with code $($process.ExitCode)."
          }

      - uses: actions/upload-artifact@v6
        with:
          name: test-player-windows
          path: ${{ runner.temp }}/player-windows

  test-player-linux:
    needs: [build, build-player-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Development-player lifecycle on Linux

          The E2E runner launches the downloaded Linux player under Xvfb and connects it to the
          native `conduit-linux-x64` artifact. Its scenario advances through four phases:

          1. Discover the player's endpoint, associate the project, and confirm `status` routing.
          2. Exercise help, scene search/show, JSON mutation, and managed reflection.
          3. Compile code on the server and run ordinary, repeated, namespace-inferred, and
             asynchronous `execute_code` calls in the player. Screenshot and Editor-only routing
             diagnostics are checked here as well.
          4. Restart the player, discard the old endpoint, and discover the replacement.

          Any launch, IPC, tool assertion, server, or restart-lifecycle error fails the job. The
          scenario targets the MCP behavior of one development-player fixture; production stripping,
          performance, rendering quality, and wider Linux compatibility require different evidence.
          EOF

      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.201

      - uses: actions/download-artifact@v8
        with:
          name: conduit-linux-x64
          path: ${{ runner.temp }}/conduit-server

      - uses: actions/download-artifact@v8
        with:
          name: test-player-linux
          path: ${{ runner.temp }}/conduit-player

      - name: Run Linux player E2E
        shell: bash
        run: |
          sudo apt-get update -o Acquire::Retries=10
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgtk-3-0 libglu1-mesa libxrandr2 libxinerama1 \
            libxcursor1 libxi6 libxss1 libnss3 libgbm1
          chmod +x "$RUNNER_TEMP/conduit-server/conduit-linux-x64"
          chmod +x "$RUNNER_TEMP/conduit-player/conduit-player"
          xvfb-run -a dotnet run --file run-unity-player-mcp-e2e.cs -- \
            --server "$RUNNER_TEMP/conduit-server/conduit-linux-x64" \
            --player "$RUNNER_TEMP/conduit-player/conduit-player"

  test-player-windows:
    needs: [build, build-player-windows]
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Native Windows pairing

          | Process      | Runtime                                            |
          | ------------ | -------------------------------------------------- |
          | E2E driver   | .NET on the Windows hosted runner                  |
          | MCP server   | downloaded `conduit-win-x64.exe`                   |
          | Unity player | downloaded `test-player-windows` development build |

          The shared player scenario covers endpoint discovery and project association, status/help,
          scene reads and mutation, reflection, compiled `execute_code`, screenshot and Editor-only
          diagnostics, then restart and replacement-endpoint discovery.

          Here every process is native Windows. Failures therefore expose Windows launch, path, IPC,
          tool, or lifecycle behavior without a compatibility layer in the middle. Production-player
          stripping and performance are separate concerns; the Proton job reuses the player artifact
          under translation.
          EOF

      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.201

      - uses: actions/download-artifact@v8
        with:
          name: conduit-win-x64
          path: ${{ runner.temp }}/conduit-server

      - uses: actions/download-artifact@v8
        with:
          name: test-player-windows
          path: ${{ runner.temp }}/conduit-player

      - name: Run Windows player E2E
        shell: pwsh
        run: |
          dotnet run --file run-unity-player-mcp-e2e.cs -- `
            --server "$env:RUNNER_TEMP\conduit-server\conduit-win-x64.exe" `
            --player "$env:RUNNER_TEMP\conduit-player\conduit-player.exe"

  test-player-proton:
    needs: [build, build-player-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Cross-runtime artifact path

          ```text
          native Linux server
              ── compiled snippet DLL ──▶ shared endpoint ──▶ Windows player
              ◀─ player reference DLL ── shared endpoint ◀── Windows player
                                                        (UMU-Proton + sniper + Xvfb)
          ```

          A BuildKit-cached Ubuntu Noble image supplies .NET, the graphical host libraries, a pinned
          UMU launcher and Proton build, and a checksum-verified Steam Runtime 3 (`sniper`). Runtime
          updates are disabled, so the E2E step performs no launcher, Proton, or runtime setup.

          Ubuntu's host AppArmor policy normally denies the nested UID map used by Pressure Vessel.
          The job permits unprivileged user namespaces only for its disposable runner VM, then runs
          UMU as the image's regular user inside the privileged container.

          The common player scenario requires both assembly transfers shown above and follows a
          restart through to discovery of the new endpoint. A pass applies to the versions pinned in
          `Proton.Dockerfile`; other Wine/Proton builds, distributions, GPUs, and native Windows
          execution have different compatibility boundaries.
          EOF

      - uses: actions/checkout@v6

      - name: Allow Pressure Vessel user namespaces
        shell: bash
        run: |
          # Ubuntu 24.04 otherwise denies bwrap's nested UID map inside Docker. This setting
          # disappears with the ephemeral runner VM and the Proton process remains non-root.
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Proton image variables
        shell: bash
        run: |
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_TAG=ghcr.io/$repo_lc/proton-player-ci:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "CACHE_REF=ghcr.io/$repo_lc/proton-player-ci:cache-v1" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: ./.github/workflows/Proton.Dockerfile
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=min

      - uses: actions/download-artifact@v8
        with:
          name: conduit-linux-x64
          path: ${{ runner.temp }}/conduit-server

      - uses: actions/download-artifact@v8
        with:
          name: test-player-windows
          path: ${{ runner.temp }}/conduit-player

      - name: Run Proton player E2E
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/conduit-server/conduit-linux-x64"

          # pressure-vessel needs nested mount and user namespaces inside the test container.
          docker run --rm --init --privileged --shm-size=8g \
            -v "$GITHUB_WORKSPACE:/mnt/conduit:ro" \
            -v "$RUNNER_TEMP/conduit-server:/mnt/conduit-server:ro" \
            -v "$RUNNER_TEMP/conduit-player:/mnt/conduit-player:ro" \
            "$IMAGE_TAG" \
            xvfb-run -a dotnet run --file /mnt/conduit/run-unity-player-mcp-e2e.cs -- \
              --server /mnt/conduit-server/conduit-linux-x64 \
              --player /mnt/conduit-player/conduit-player.exe \
              --launcher /usr/bin/umu-run \
              --expect-reverse-artifacts

  prepare:
    if: needs.version.outputs.release_requested == 'true' && github.ref == 'refs/heads/master'
    needs:
      - version
      - build
      - test-server
      - test-server-binary
      - test-server-binary-musl
      - test-unity
      - test-unity-consumer
      - test-unity-editor-windows
      - test-player-linux
      - test-player-windows
      - test-player-proton
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      sha: ${{ steps.push.outputs.sha }}
      version_new: ${{ steps.prepare.outputs.new }}
    env:
      PACKAGE_JSON: Conduit.Unity/package.json

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Guarded stable-release mutation

          This job is reachable only for a release-requesting `master` run after every server,
          Unity, production-consumer, and player gate has passed.

          ```text
          apply planned version to Conduit.Unity/package.json
                            ↓
          create local [release] [skip ci] bot commit
                            ↓
          fetch master and compare its tip with the tested workflow SHA
             ├─ changed   → stop successfully; emit no release SHA
             └─ unchanged → push commit normally
                                  ↓
                            push vMAJOR.MINOR.PATCH tag
                                  ↓
                            expose commit SHA to release
          ```

          The comparison is a snapshot. A normal, non-force branch push supplies the final guard
          if `master` advances after that comparison. The branch and semantic tag are separate
          pushes; GitHub Release metadata and binaries are untouched in this job.
          EOF

      - name: Record target ref
        id: target
        shell: bash
        run: echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply planned version bump
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          next="${{ needs.version.outputs.package_version }}"
          tmp="$PACKAGE_JSON.tmp"
          jq --arg v "$next" '.version = $v' "$PACKAGE_JSON" > "$tmp"
          mv "$tmp" "$PACKAGE_JSON"

          echo "new=$next" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: steps.prepare.outputs.new != ''
        id: push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PACKAGE_JSON"
          git commit -m "${{ github.event.repository.name }} ${{ steps.prepare.outputs.new }} [release] [skip ci]"

          ref="${{ steps.target.outputs.ref }}"
          base_sha="${{ github.sha }}"
          git fetch origin "$ref" --quiet
          remote_sha="$(git rev-parse "origin/$ref")"
          if [[ "$remote_sha" != "$base_sha" ]]; then
            echo "::notice::Remote branch '$ref' advanced to $remote_sha; cancelling release."
            exit 0
          fi

          git push origin "HEAD:$ref"
          git tag "v${{ steps.prepare.outputs.new }}"
          git push origin "v${{ steps.prepare.outputs.new }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    if: needs.prepare.outputs.sha != '' && github.ref == 'refs/heads/master'
    needs: [version, prepare]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Describe job
        shell: bash
        run: |
          cat <<'EOF'
          ### Rolling stable release update

          The inputs are the exact commit emitted by `prepare` and the three x64 server artifacts
          built and tested earlier in this run: `conduit-linux-musl-x64`, `conduit-linux-x64`, and
          `conduit-win-x64.exe`. No rebuild occurs during publication.

          1. Generate installation, Unity-compatibility, and recent-commit notes from repository
             history.
          2. Fetch `master` again. If its tip differs from the release commit, record a skipped
             release and leave the existing rolling release unchanged.
          3. Force-move the `release` tag to the prepared commit, then create or edit its GitHub
             Release and mark it Latest.
          4. Replace the three named assets and remove every stale extra asset.

          > The branch comparison is a point-in-time freshness check. Publication is serialized,
          > but the tag push, release edit, uploads, and deletions are separate remote operations.
          > In particular, `--clobber` deletes an existing same-name asset before uploading its
          > replacement.
          EOF

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: conduit-*-x64
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="release-notes.md"
          upper="${{ needs.prepare.outputs.sha }}"
          repo_url="https://github.com/${{ github.repository }}"
          package_url="$repo_url.git?path=/Conduit.Unity#release"
          unity_version="$(jq -r '.unity' Conduit.Unity/package.json)"
          prev_tag="${{ needs.version.outputs.previous_tag }}"

          declare -A since=()
          if [[ -n "${prev_tag:-}" ]]; then
            while read -r s; do
              [[ -n "$s" ]] && since["$s"]=1
            done < <(git rev-list "${prev_tag}..$upper")
          fi

          ref="${{ needs.prepare.outputs.ref }}"
          cat > "$notes" <<MD

          This is a rolling release. Whenever all tests pass, it is automatically updated
          to point to the latest release tag.

          Installation
          --------------
          Compatibility: ***Unity $unity_version or newer***

          Recommended method:
          - Window ⟶ Package Manager ⟶ \`+\` ⟶ "Install package from git URL"
          - Paste the URL
          \`\`\`md
          $package_url
          \`\`\`
          Latest changes
          --------------
          | Author | Release | Commit | SHA |
          | ------ | ------- | ------ | --- |
          MD

          limit=16
          count=0

          mapfile -t rel_tags < <(git for-each-ref --sort=creatordate --format='%(refname:short)' refs/tags | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)

          git log -n 24 "$upper" --pretty=format:%H%x09%s%x09%an%x09%ae |
          while IFS=$'\t' read -r sha msg author email; do
            lc_author="$(printf '%s' "$author" | tr '[:upper:]' '[:lower:]')"
            lc_email="$(printf '%s' "$email" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lc_author" == "github-actions[bot]" || "$lc_email" == "41898282+github-actions[bot]@users.noreply.github.com" ]]; then
              continue
            fi

            short="${sha:0:7}"
            shortlink="[$short]($repo_url/commit/$sha)"
            msg="${msg//|/\\|}"

            new_prefix=""
            if [[ -n "${since[$sha]:-}" ]]; then
              new_prefix="✨ "
            fi

            info="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '{email: .commit.author.email, login: (.author.login // .committer.login), profile: (.author.html_url // .committer.html_url), avatar: (.author.avatar_url // .committer.avatar_url)}')"
            login="$(jq -r '.login // empty' <<<"$info")"
            login_display="${login%\[bot\]}"
            profile="$(jq -r '.profile // empty' <<<"$info")"
            avatar_url="$(jq -r '.avatar // empty' <<<"$info")"

            if [[ -n "$avatar_url" && "$avatar_url" != "null" ]]; then
              avatar="$avatar_url"
            else
              email_lookup="$(jq -r '.email // empty' <<<"$info" | tr '[:upper:]' '[:lower:]')"
              if [[ -n "$email_lookup" ]]; then
                hash="$(printf '%s' "$email_lookup" | md5sum | awk '{print $1}')"
                base="www.gravatar.com/avatar/$hash?d=identicon"
              else
                base="www.gravatar.com/avatar/?d=mp"
              fi
              avatar="https://wsrv.nl/?url=${base}&w=48&h=48&mask=circle&fit=cover&maxage=1w"
            fi

            author_text="$author"
            author_text="${author_text//|/\\|}"
            author_text="${author_text%\[bot\]}"

            if [[ -n "$login" && "$login" != "null" && -n "$profile" && "$profile" != "null" ]]; then
              author_cell="<a href=\"$profile\"><img src=\"$avatar\" width=\"24\" height=\"24\" /></a> @$login_display"
            else
              author_cell="<img src=\"$avatar\" width=\"24\" height=\"24\" /> $author_text"
            fi

            version="-"
            for t in "${rel_tags[@]}"; do
              tcommit="$(git rev-list -n 1 "$t")"
              if git merge-base --is-ancestor "$sha" "$tcommit"; then
                version="$t"
                break
              fi
            done
            version="${new_prefix}${version}"

            printf '| %s | %s | %s | %s |\n' "$author_cell" "$version" "$msg" "$shortlink" >> "$notes"

            count=$((count + 1))
            if [[ $count -ge $limit ]]; then
              break
            fi
          done

          if [[ -n "${prev_tag:-}" ]]; then
            printf '\n#### [View diff since previous tagged release](%s/compare/%s...release)\n' "$repo_url" "$prev_tag" >> "$notes"
          fi
          printf '#### [More recent commits](%s/commits/%s/)\n' "$repo_url" "$ref" >> "$notes"

          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify release target
        id: verify
        shell: bash
        run: |
          ref="${{ needs.prepare.outputs.ref }}"
          release_sha="${{ needs.prepare.outputs.sha }}"

          git fetch origin "$ref" --quiet
          remote_sha="$(git rev-parse "origin/$ref")"
          if [[ "$remote_sha" != "$release_sha" ]]; then
            echo "::notice::Remote branch '$ref' advanced from $release_sha to $remote_sha; cancelling release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Release skipped"
              echo
              echo "The branch no longer points to the release commit."
              echo
              echo "- Ref: \`$ref\`"
              echo "- Release commit: \`$release_sha\`"
              echo "- Current tip: \`$remote_sha\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update rolling release
        if: steps.verify.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag="release"
          title="v${{ needs.prepare.outputs.version_new }} ($(date -u '+%d-%m-%Y'))"
          notes="release-notes.md"

          git tag -fa "$tag" "${{ needs.prepare.outputs.sha }}" -m "Latest rolling release"
          git push -f origin "refs/tags/$tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes" --latest
          else
            gh release create "$tag" --title "$title" --notes-file "$notes" --target "${{ needs.prepare.outputs.sha }}" --latest
          fi

          files=(
            release-assets/conduit-linux-musl-x64
            release-assets/conduit-linux-x64
            release-assets/conduit-win-x64.exe
          )
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing release asset '$file'."
              exit 1
            fi
          done
          gh release upload "$tag" "${files[@]}" --clobber

          mapfile -t published < <(gh release view "$tag" --json assets --jq '.assets[].name')
          for asset in "${published[@]}"; do
            case "$asset" in
              conduit-linux-musl-x64|conduit-linux-x64|conduit-win-x64.exe) ;;
              *) gh release delete-asset "$tag" "$asset" --yes ;;
            esac
          done
